<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 120 40"
     width="120" height="40"
     class="ship ship-cruiser"
     data-size="3"
     role="img"
     aria-label="Cruiser (size 3)">

  <style>
    .ship { overflow: visible; }

    .segment {
      transition: fill 0.25s ease, filter 0.25s ease;
      cursor: pointer;
    }
    .seg-body   { fill: #3e6e8a; }
    .seg-bow    { fill: #4e8eaa; }
    .seg-stern  { fill: #2e5e7a; }

    .segment.hit .seg-body,
    .segment.hit .seg-bow,
    .segment.hit .seg-stern {
      fill: #c0392b;
      filter: drop-shadow(0 0 4px #ff6b6b);
    }
    .segment.hit .hit-marker { display: block; }
    .hit-marker { display: none; }

    .segment:not(.hit):hover .seg-body,
    .segment:not(.hit):hover .seg-bow,
    .segment:not(.hit):hover .seg-stern {
      fill: #6aafd4;
    }

    .ship.vertical {
      transform: rotate(90deg);
      transform-origin: 20px 20px;
    }
  </style>

  <!-- Segment 0 — stern -->
  <g class="segment" id="seg-0" data-index="0">
    <!-- Angular stern (different from sub's rounded) -->
    <path class="seg-stern"
          d="M 8,8 L 40,4 V 36 L 8,32 Z"/>
    <circle cx="16" cy="14" r="2" fill="#1e3e5a" opacity="0.6"/>
    <circle cx="16" cy="26" r="2" fill="#1e3e5a" opacity="0.6"/>
    <circle cx="30" cy="10" r="2" fill="#1e3e5a" opacity="0.6"/>
    <circle cx="30" cy="30" r="2" fill="#1e3e5a" opacity="0.6"/>
    <rect x="8" y="17" width="32" height="6" fill="#3a8abf" opacity="0.4" rx="2"/>
    <!-- twin missile launchers -->
    <rect x="12" y="1" width="5" height="4" fill="#2a5070" rx="1"/>
    <rect x="20" y="1" width="5" height="4" fill="#2a5070" rx="1"/>
    <g class="hit-marker">
      <line x1="8"  y1="8"  x2="38" y2="34" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="38" y1="8"  x2="8"  y2="34" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <line x1="40" y1="4" x2="40" y2="36" stroke="#1e3e5a" stroke-width="1.5"/>
  </g>

  <!-- Segment 1 — mid body -->
  <g class="segment" id="seg-1" data-index="1">
    <rect class="seg-body" x="40" y="4" width="40" height="32"/>
    <circle cx="52" cy="12" r="2" fill="#1e3e5a" opacity="0.6"/>
    <circle cx="52" cy="28" r="2" fill="#1e3e5a" opacity="0.6"/>
    <circle cx="68" cy="12" r="2" fill="#1e3e5a" opacity="0.6"/>
    <circle cx="68" cy="28" r="2" fill="#1e3e5a" opacity="0.6"/>
    <rect x="40" y="17" width="40" height="6" fill="#3a8abf" opacity="0.4"/>
    <!-- command bridge -->
    <rect x="46" y="-2" width="28" height="8" fill="#2e5e7a" rx="2"/>
    <rect x="52" y="-8" width="16" height="8" fill="#1e4e6a" rx="1"/>
    <!-- twin funnels -->
    <rect x="53" y="-14" width="5" height="8" fill="#1e3e5a" rx="1"/>
    <rect x="62" y="-14" width="5" height="8" fill="#1e3e5a" rx="1"/>
    <g class="hit-marker">
      <line x1="42" y1="6"  x2="78" y2="34" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="78" y1="6"  x2="42" y2="34" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <line x1="40"  y1="4" x2="40"  y2="36" stroke="#1e3e5a" stroke-width="1.5"/>
    <line x1="80" y1="4" x2="80" y2="36" stroke="#1e3e5a" stroke-width="1.5"/>
  </g>

  <!-- Segment 2 — bow -->
  <g class="segment" id="seg-2" data-index="2">
    <!-- Angular bow -->
    <path class="seg-bow"
          d="M 80,4 L 112,8 L 116,20 L 112,32 L 80,36 Z"/>
    <circle cx="86" cy="12" r="2" fill="#1e3e5a" opacity="0.6"/>
    <circle cx="86" cy="28" r="2" fill="#1e3e5a" opacity="0.6"/>
    <circle cx="106" cy="14" r="2" fill="#1e3e5a" opacity="0.6"/>
    <circle cx="106" cy="26" r="2" fill="#1e3e5a" opacity="0.6"/>
    <rect x="80" y="17" width="32" height="6" fill="#3a8abf" opacity="0.4"/>
    <!-- bow gun -->
    <rect x="100" y="6" width="14" height="5" fill="#2a5070" rx="1"/>
    <rect x="112" y="7" width="6" height="3" fill="#1a3050" rx="1"/>
    <g class="hit-marker">
      <line x1="82"  y1="6"  x2="114" y2="34" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="114" y1="6"  x2="82"  y2="34" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

</svg>
