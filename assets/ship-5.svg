<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 40"
     width="200" height="40"
     class="ship ship-5"
     data-size="5"
     role="img"
     aria-label="Aircraft Carrier (size 5)">

  <style>
    .segment { cursor: pointer; }
    .seg-body  { fill: #4a7c9e; }
    .seg-bow   { fill: #5a9abf; }
    .seg-stern { fill: #3a6a8e; }

    .segment.hit .seg-body,
    .segment.hit .seg-bow,
    .segment.hit .seg-stern {
      fill: #c0392b;
      filter: drop-shadow(0 0 4px #ff6b6b);
    }
    .segment.hit .hit-marker { display: block; }
    .hit-marker { display: none; }

    .ship.vertical {
      transform: rotate(90deg);
      transform-origin: 0px 0px;
    }
  </style>

  <!-- Segment 0 — stern -->
  <g class="segment" id="seg-0" data-index="0">
    <path class="seg-stern" d="M 12,4 H 40 V 36 H 12 Q 2,36 2,20 Q 2,4 12,4 Z"/>
    <rect x="10" y="10" width="26" height="20" fill="#2a5a7e" opacity="0.3" rx="2"/>
    <!-- flight deck overhang strip at top (inside) -->
    <rect x="4"  y="5"  width="36" height="5" fill="#3a6a8e" opacity="0.8" rx="1"/>
    <!-- runway dashes -->
    <line x1="6"  y1="7.5" x2="12" y2="7.5" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <line x1="16" y1="7.5" x2="22" y2="7.5" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <line x1="26" y1="7.5" x2="32" y2="7.5" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <!-- waterline -->
    <line x1="4" y1="28" x2="40" y2="28" stroke="#2a4a6a" stroke-width="1" opacity="0.5"/>
    <circle cx="18" cy="22" r="3" fill="none" stroke="#2a4a6a" stroke-width="1.5" opacity="0.6"/>
    <circle cx="30" cy="22" r="3" fill="none" stroke="#2a4a6a" stroke-width="1.5" opacity="0.6"/>
    <g class="hit-marker">
      <line x1="5"  y1="7"  x2="37" y2="33" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="37" y1="7"  x2="5"  y2="33" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <line x1="40" y1="4" x2="40" y2="36" stroke="#1e3a5a" stroke-width="1.5"/>
  </g>

  <!-- Segment 1 — aft body -->
  <g class="segment" id="seg-1" data-index="1">
    <rect class="seg-body" x="40" y="4" width="40" height="32"/>
    <rect x="40" y="5"  width="40" height="5" fill="#3a6a8e" opacity="0.8"/>
    <line x1="42" y1="7.5" x2="48" y2="7.5" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <line x1="52" y1="7.5" x2="58" y2="7.5" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <line x1="62" y1="7.5" x2="68" y2="7.5" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <line x1="72" y1="7.5" x2="78" y2="7.5" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <rect x="44" y="14" width="32" height="14" fill="#2a5a7e" opacity="0.3" rx="2"/>
    <line x1="40" y1="28" x2="80" y2="28" stroke="#2a4a6a" stroke-width="1" opacity="0.5"/>
    <circle cx="52" cy="23" r="3" fill="none" stroke="#2a4a6a" stroke-width="1.5" opacity="0.6"/>
    <circle cx="68" cy="23" r="3" fill="none" stroke="#2a4a6a" stroke-width="1.5" opacity="0.6"/>
    <g class="hit-marker">
      <line x1="43" y1="7"  x2="77" y2="33" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="77" y1="7"  x2="43" y2="33" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <line x1="40"  y1="4" x2="40"  y2="36" stroke="#1e3a5a" stroke-width="1.5"/>
    <line x1="80" y1="4" x2="80" y2="36" stroke="#1e3a5a" stroke-width="1.5"/>
  </g>

  <!-- Segment 2 — mid (island) -->
  <g class="segment" id="seg-2" data-index="2">
    <rect class="seg-body" x="80" y="4" width="40" height="32"/>
    <rect x="80" y="5"  width="40" height="5" fill="#3a6a8e" opacity="0.8"/>
    <line x1="82" y1="7.5" x2="88" y2="7.5" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <line x1="92" y1="7.5" x2="98" y2="7.5" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <line x1="102" y1="7.5" x2="108" y2="7.5" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <line x1="112" y1="7.5" x2="118" y2="7.5" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <!-- island superstructure (inside hull) -->
    <rect x="88" y="11" width="24" height="14" fill="#2a5070" rx="2"/>
    <!-- island windows -->
    <rect x="91" y="13" width="5" height="3" fill="#aad4ee" opacity="0.7" rx="1"/>
    <rect x="99" y="13" width="5" height="3" fill="#aad4ee" opacity="0.7" rx="1"/>
    <rect x="107" y="13" width="4" height="3" fill="#aad4ee" opacity="0.7" rx="1"/>
    <!-- radar dish (inside) -->
    <rect x="98" y="5" width="4"  height="8" fill="#1e3a5a" stroke-width="0"/>
    <ellipse cx="100" cy="5" rx="6" ry="2" fill="none" stroke="#1e3a5a" stroke-width="1.5"/>
    <line x1="80" y1="28" x2="120" y2="28" stroke="#2a4a6a" stroke-width="1" opacity="0.5"/>
    <g class="hit-marker">
      <line x1="83"  y1="7"  x2="117" y2="33" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="117" y1="7"  x2="83"  y2="33" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <line x1="80"  y1="4" x2="80"  y2="36" stroke="#1e3a5a" stroke-width="1.5"/>
    <line x1="120" y1="4" x2="120" y2="36" stroke="#1e3a5a" stroke-width="1.5"/>
  </g>

  <!-- Segment 3 — fore body -->
  <g class="segment" id="seg-3" data-index="3">
    <rect class="seg-body" x="120" y="4" width="40" height="32"/>
    <rect x="120" y="5"  width="40" height="5" fill="#3a6a8e" opacity="0.8"/>
    <line x1="122" y1="7.5" x2="128" y2="7.5" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <line x1="132" y1="7.5" x2="138" y2="7.5" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <line x1="142" y1="7.5" x2="148" y2="7.5" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <line x1="152" y1="7.5" x2="158" y2="7.5" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <rect x="124" y="14" width="32" height="14" fill="#2a5a7e" opacity="0.3" rx="2"/>
    <line x1="120" y1="28" x2="160" y2="28" stroke="#2a4a6a" stroke-width="1" opacity="0.5"/>
    <circle cx="132" cy="23" r="3" fill="none" stroke="#2a4a6a" stroke-width="1.5" opacity="0.6"/>
    <circle cx="148" cy="23" r="3" fill="none" stroke="#2a4a6a" stroke-width="1.5" opacity="0.6"/>
    <g class="hit-marker">
      <line x1="123" y1="7"  x2="157" y2="33" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="157" y1="7"  x2="123" y2="33" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <line x1="120" y1="4" x2="120" y2="36" stroke="#1e3a5a" stroke-width="1.5"/>
    <line x1="160" y1="4" x2="160" y2="36" stroke="#1e3a5a" stroke-width="1.5"/>
  </g>

  <!-- Segment 4 — bow -->
  <g class="segment" id="seg-4" data-index="4">
    <path class="seg-bow" d="M 160,4 H 188 Q 198,4 198,20 Q 198,36 188,36 H 160 Z"/>
    <rect x="160" y="5"  width="32" height="5" fill="#3a6a8e" opacity="0.8"/>
    <line x1="162" y1="7.5" x2="168" y2="7.5" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <line x1="172" y1="7.5" x2="178" y2="7.5" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <line x1="182" y1="7.5" x2="188" y2="7.5" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <rect x="164" y="14" width="26" height="14" fill="#2a5a7e" opacity="0.3" rx="2"/>
    <line x1="160" y1="28" x2="196" y2="28" stroke="#2a4a6a" stroke-width="1" opacity="0.5"/>
    <circle cx="170" cy="23" r="3" fill="none" stroke="#2a4a6a" stroke-width="1.5" opacity="0.6"/>
    <circle cx="182" cy="23" r="3" fill="none" stroke="#2a4a6a" stroke-width="1.5" opacity="0.6"/>
    <g class="hit-marker">
      <line x1="163" y1="7"  x2="195" y2="33" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="195" y1="7"  x2="163" y2="33" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

</svg>
