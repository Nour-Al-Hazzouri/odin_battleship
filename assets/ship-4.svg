<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 160 40"
     width="160" height="40"
     class="ship ship-4"
     data-size="4"
     role="img"
     aria-label="Destroyer (size 4)">

  <style>
    .ship { overflow: visible; }

    .segment {
      transition: fill 0.25s ease, filter 0.25s ease;
      cursor: pointer;
    }
    .seg-body   { fill: #4a7c9e; }
    .seg-bow    { fill: #5a9abf; }
    .seg-stern  { fill: #3a6a8e; }

    .segment.hit .seg-body,
    .segment.hit .seg-bow,
    .segment.hit .seg-stern {
      fill: #c0392b;
      filter: drop-shadow(0 0 4px #ff6b6b);
    }
    .segment.hit .hit-marker { display: block; }
    .hit-marker { display: none; }

    .segment:not(.hit):hover .seg-body,
    .segment:not(.hit):hover .seg-bow,
    .segment:not(.hit):hover .seg-stern {
      fill: #6aafd4;
    }

    .ship.vertical {
      transform: rotate(90deg);
      transform-origin: 20px 20px;
    }
  </style>

  <!-- Segment 0 — stern -->
  <g class="segment" id="seg-0" data-index="0">
    <path class="seg-stern"
          d="M 12,4 H 40 V 36 H 12 Q 2,36 2,20 Q 2,4 12,4 Z"/>
    <circle cx="14" cy="12" r="2" fill="#2a4a6a" opacity="0.6"/>
    <circle cx="14" cy="28" r="2" fill="#2a4a6a" opacity="0.6"/>
    <circle cx="26" cy="8"  r="2" fill="#2a4a6a" opacity="0.6"/>
    <circle cx="26" cy="32" r="2" fill="#2a4a6a" opacity="0.6"/>
    <rect x="8" y="17" width="32" height="6" fill="#3a8abf" opacity="0.4" rx="2"/>
    <!-- exhaust stack -->
    <rect x="18" y="0" width="8" height="5" fill="#2a5a7e" rx="1"/>
    <circle cx="22" cy="0" r="2" fill="#1a3a5e"/>
    <g class="hit-marker">
      <line x1="4"  y1="6"  x2="38" y2="34" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="38" y1="6"  x2="4"  y2="34" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <line x1="40" y1="4" x2="40" y2="36" stroke="#2a4a6a" stroke-width="1.5"/>
  </g>

  <!-- Segment 1 — mid-stern body -->
  <g class="segment" id="seg-1" data-index="1">
    <rect class="seg-body" x="40" y="4" width="40" height="32"/>
    <circle cx="52" cy="12" r="2" fill="#2a4a6a" opacity="0.6"/>
    <circle cx="52" cy="28" r="2" fill="#2a4a6a" opacity="0.6"/>
    <circle cx="68" cy="12" r="2" fill="#2a4a6a" opacity="0.6"/>
    <circle cx="68" cy="28" r="2" fill="#2a4a6a" opacity="0.6"/>
    <rect x="40" y="17" width="40" height="6" fill="#3a8abf" opacity="0.4"/>
    <!-- gun turret -->
    <rect x="50" y="0" width="20" height="6" fill="#3a6a8e" rx="2"/>
    <rect x="56" y="-4" width="8" height="5" fill="#2a5070" rx="1"/>
    <g class="hit-marker">
      <line x1="42" y1="6"  x2="78" y2="34" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="78" y1="6"  x2="42" y2="34" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <line x1="40"  y1="4" x2="40"  y2="36" stroke="#2a4a6a" stroke-width="1.5"/>
    <line x1="80" y1="4" x2="80" y2="36" stroke="#2a4a6a" stroke-width="1.5"/>
  </g>

  <!-- Segment 2 — mid-bow body -->
  <g class="segment" id="seg-2" data-index="2">
    <rect class="seg-body" x="80" y="4" width="40" height="32"/>
    <circle cx="92"  cy="12" r="2" fill="#2a4a6a" opacity="0.6"/>
    <circle cx="92"  cy="28" r="2" fill="#2a4a6a" opacity="0.6"/>
    <circle cx="108" cy="12" r="2" fill="#2a4a6a" opacity="0.6"/>
    <circle cx="108" cy="28" r="2" fill="#2a4a6a" opacity="0.6"/>
    <rect x="80" y="17" width="40" height="6" fill="#3a8abf" opacity="0.4"/>
    <!-- bridge superstructure -->
    <rect x="88" y="-2" width="24" height="8" fill="#3a6a8e" rx="2"/>
    <rect x="92" y="-6" width="16" height="6" fill="#2a5070" rx="1"/>
    <g class="hit-marker">
      <line x1="82"  y1="6"  x2="118" y2="34" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="118" y1="6"  x2="82"  y2="34" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <line x1="80"  y1="4" x2="80"  y2="36" stroke="#2a4a6a" stroke-width="1.5"/>
    <line x1="120" y1="4" x2="120" y2="36" stroke="#2a4a6a" stroke-width="1.5"/>
  </g>

  <!-- Segment 3 — bow -->
  <g class="segment" id="seg-3" data-index="3">
    <path class="seg-bow"
          d="M 120,4 H 148 Q 158,4 158,20 Q 158,36 148,36 H 120 Z"/>
    <circle cx="126" cy="12" r="2" fill="#2a4a6a" opacity="0.6"/>
    <circle cx="126" cy="28" r="2" fill="#2a4a6a" opacity="0.6"/>
    <circle cx="148" cy="12" r="2" fill="#2a4a6a" opacity="0.6"/>
    <circle cx="148" cy="28" r="2" fill="#2a4a6a" opacity="0.6"/>
    <rect x="120" y="17" width="32" height="6" fill="#3a8abf" opacity="0.4"/>
    <g class="hit-marker">
      <line x1="122" y1="6"  x2="156" y2="34" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="156" y1="6"  x2="122" y2="34" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

</svg>
